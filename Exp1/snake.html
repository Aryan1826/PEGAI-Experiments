<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        /* General Reset and Body Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: monospace, sans-serif; /* Using a system font for maximum offline compatibility */
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); /* Modern gradient background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Prevent scrolling */
            color: #ecf0f1;
            font-size: 1rem;
        }

        /* Game Container */
        .game-container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            text-align: center;
            border: 2px solid #3498db;
            max-width: 500px;
            width: 90%; /* Responsive width */
            box-sizing: border-box; /* Include padding/border in element's total width/height */
            position: relative; /* For positioning the game over overlay */
        }

        h1 {
            color: #2ecc71;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.7);
        }

        /* Score Display */
        .score-display {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f1c40f;
            text-shadow: 0 0 8px rgba(241, 196, 15, 0.5);
        }

        /* Game Canvas */
        canvas {
            background-color: #2c3e50; /* Darker background for the game board */
            border: 5px solid #3498db;
            border-radius: 8px;
            display: block; /* Remove extra space below canvas */
            margin: 0 auto; /* Center the canvas */
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        /* Game Over Screen */
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* Darker overlay */
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0; /* Initially hidden */
            visibility: hidden; /* For screen readers and interaction */
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        .game-over-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .game-over-message {
            color: #e74c3c;
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(231, 76, 60, 0.8);
        }

        .final-score {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        /* Restart Button */
        .restart-button {
            background-color: #2ecc71;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            outline: none; /* Remove focus outline */
        }

        .restart-button:hover {
            background-color: #27ae60;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.6);
        }

        .restart-button:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(46, 204, 113, 0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
                width: 95%; /* Make container slightly wider on small screens */
            }
            h1 {
                font-size: 1.8rem;
            }
            .score-display {
                font-size: 1.2rem;
            }
            .game-over-message {
                font-size: 2.2rem;
            }
            .final-score {
                font-size: 1.5rem;
            }
            .restart-button {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }

        @media (max-height: 700px) {
            .game-container {
                margin: 20px 0; /* Add vertical margin if height is constrained */
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Snake Game</h1>
        <div class="score-display">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas"></canvas>

        <div id="gameOverOverlay" class="game-over-overlay">
            <div class="game-over-message">GAME OVER!</div>
            <div class="final-score">Your Score: <span id="finalScore">0</span></div>
            <button id="restartButton" class="restart-button">Restart Game</button>
        </div>
    </div>

    <script>
        // --- Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');

        const gridSize = 20; // Size of each snake segment/food item in pixels
        const boardSize = 20; // Number of grid units across and down (e.g., 20x20 grid)

        // Set canvas dimensions based on grid size
        canvas.width = gridSize * boardSize; // 400px
        canvas.height = gridSize * boardSize; // 400px

        // Game state variables
        let snake = [];
        let food = {};
        let dx = 0; // Direction X (1 for right, -1 for left)
        let dy = 0; // Direction Y (1 for down, -1 for up)
        let score = 0;
        let gameOver = false;

        let lastRenderTime = 0;
        const gameSpeed = 150; // Milliseconds per game logic tick (lower is faster)
        let animationFrameId; // Stores the ID returned by requestAnimationFrame
        let directionLocked = false; // Prevents multiple direction changes within a single game tick

        // --- Game Initialization ---
        function initGame() {
            // Reset game state to initial values
            snake = [
                { x: 8, y: 10 }, // Head starting position
                { x: 7, y: 10 },
                { x: 6, y: 10 }  // Tail starting position
            ];
            dx = 1; // Start moving right
            dy = 0;
            score = 0;
            gameOver = false;
            directionLocked = false; // Reset lock for new game

            scoreDisplay.textContent = score;
            gameOverOverlay.classList.remove('visible'); // Hide game over screen

            generateFood(); // Place initial food

            // Clear any existing animation frame and start a new game loop
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            lastRenderTime = 0; // Reset timer for first frame
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- Main Game Loop (uses requestAnimationFrame for smooth drawing) ---
        function gameLoop(currentTime) {
            // Control game logic update speed independently of frame rate
            const secondsSinceLastRender = currentTime - lastRenderTime;

            if (secondsSinceLastRender < gameSpeed) {
                // If not enough time has passed for a logic update, just draw the current state
                drawGame();
                animationFrameId = requestAnimationFrame(gameLoop);
                return;
            }

            // Update game logic only when `gameSpeed` time has passed
            lastRenderTime = currentTime;
            directionLocked = false; // Allow direction change for the upcoming tick

            updateGame();
            drawGame();

            // Continue loop if game is not over
            if (!gameOver) {
                animationFrameId = requestAnimationFrame(gameLoop);
            } else {
                endGame(); // Stop loop and show game over screen
            }
        }

        // --- Update Game Logic ---
        function updateGame() {
            if (gameOver) return;

            // Calculate the new head position
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check for wall collision
            if (head.x < 0 || head.x >= boardSize ||
                head.y < 0 || head.y >= boardSize) {
                gameOver = true;
                return;
            }

            // Check for self collision (head colliding with any body segment)
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver = true;
                    return;
                }
            }

            // Add the new head to the beginning of the snake array
            snake.unshift(head);

            // Check if snake ate food
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreDisplay.textContent = score;
                generateFood(); // Generate new food, snake automatically grows because tail is not removed
            } else {
                snake.pop(); // Remove the tail segment if no food was eaten
            }
        }

        // --- Draw Game Elements on Canvas ---
        function drawGame() {
            // Clear the entire canvas for redrawing
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw food
            ctx.fillStyle = '#e74c3c'; /* Red food */
            ctx.strokeStyle = '#c0392b'; /* Darker red border */
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);

            // Draw snake segments
            for (let i = 0; i < snake.length; i++) {
                if (i === 0) {
                    // Head of the snake
                    ctx.fillStyle = '#2ecc71'; /* Bright green */
                    ctx.strokeStyle = '#27ae60'; /* Darker green border */
                } else {
                    // Body segments
                    ctx.fillStyle = '#27ae60'; /* Slightly darker green */
                    ctx.strokeStyle = '#1e8449'; /* Even darker green border */
                }
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize, gridSize);
                ctx.strokeRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize, gridSize);
            }
        }

        // --- Generate Food at a Random Position ---
        function generateFood() {
            let newFoodX, newFoodY;
            let collisionWithSnake;

            do {
                // Generate random coordinates within the board
                newFoodX = Math.floor(Math.random() * boardSize);
                newFoodY = Math.floor(Math.random() * boardSize);
                
                // Check if the new food position overlaps with any part of the snake
                collisionWithSnake = false;
                for (let i = 0; i < snake.length; i++) {
                    if (newFoodX === snake[i].x && newFoodY === snake[i].y) {
                        collisionWithSnake = true;
                        break;
                    }
                }
            } while (collisionWithSnake); // Repeat until food spawns in a clear spot

            food = { x: newFoodX, y: newFoodY };
        }

        // --- End Game State ---
        function endGame() {
            cancelAnimationFrame(animationFrameId); // Stop the requestAnimationFrame loop
            finalScoreDisplay.textContent = score;
            gameOverOverlay.classList.add('visible'); // Show the game over overlay
        }

        // --- Event Listeners ---

        // Handle arrow key presses for snake direction
        document.addEventListener('keydown', e => {
            // Prevent changing direction multiple times within a single game tick
            // and prevent immediate 180-degree turns
            if (directionLocked) return;

            let newDx = dx;
            let newDy = dy;

            switch (e.key) {
                case 'ArrowUp':
                    if (dy !== 1) { newDx = 0; newDy = -1; } // Can't go up if currently going down
                    break;
                case 'ArrowDown':
                    if (dy !== -1) { newDx = 0; newDy = 1; } // Can't go down if currently going up
                    break;
                case 'ArrowLeft':
                    if (dx !== 1) { newDx = -1; newDy = 0; } // Can't go left if currently going right
                    break;
                case 'ArrowRight':
                    if (dx !== -1) { newDx = 1; newDy = 0; } // Can't go right if currently going left
                    break;
                default:
                    return; // Ignore other keys
            }

            // If the direction actually changed, update and lock the direction for this tick
            if (newDx !== dx || newDy !== dy) {
                dx = newDx;
                dy = newDy;
                directionLocked = true; // Lock direction until next game logic update
            }

            e.preventDefault(); // Prevent default browser behavior for arrow keys (e.g., scrolling)
        });

        // Handle Restart button click
        restartButton.addEventListener('click', initGame);

        // --- Start the game automatically when the page loads ---
        initGame();

    </script>
</body>
</html>
